<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nors Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <span class="logo-icon"><img src="Gambars/logo2.jpg" alt="Logo" /></span>
                    <h1>Nors Bakery</h1>
                </a>

                 <nav class="nav-desktop">
                    <a href="index.html" data-testid="nav-home">Home</a>
                    <a href="products.html" data-testid="nav-products">Products</a>
                    <a href="about.html" data-testid="nav-about">About</a>
                    <a href="contact.html" data-testid="nav-contact">Contact</a>
                </nav>

                <div class="header-actions">
                    <button class="mobile-menu-btn" onclick="toggleMobileMenu()" data-testid="button-mobile-menu">
                        <span class="hamburger" id="hamburger">☰</span>
                    </button>
                </div>
            </div>
        <div class="mobile-menu" id="mobile-menu">
                <nav class="nav-mobile">
                    <a href="index.html" onclick="closeMobileMenu()" data-testid="nav-mobile-home">Home</a>
                    <a href="products.html" onclick="closeMobileMenu()" data-testid="nav-mobile-products">Products</a>
                    <a href="about.html" onclick="closeMobileMenu()" data-testid="nav-mobile-about">About</a>
                    <a href="contact.html" onclick="closeMobileMenu()" data-testid="nav-mobile-contact">Contact</a>
                </nav>
            </div>
        </div>
    </header>

<header class="header">
    </header>

<div class="login-container">
            <h2>Login</h2>
            <form class="login-form" onsubmit="window.login(event)">
        <input type="email" id="login-email" placeholder="Email Address" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary btn-full">Login</button>
    </form>

    <p id="message" class="message"></p>
    
    <div class="signup-link">
        Don't have an account? <a href="register.html">Sign up here</a>
    </div>
    <div class="signup-link">
        Admin? <a href="admin.html">Login as Admin</a>
    </div>
</div>

    <script type="module" src="script.js"></script>
</body>
</html>
