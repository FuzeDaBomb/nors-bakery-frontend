<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nors Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
    max-width: 400px;
    width: 95%;              /* Responsive on mobile */
    margin: 8rem auto;       /* Centers it and moves it down from header */
    padding: 2.5rem;
    background: var(--card);
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
}

.login-form {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    width: 100%;
}

.login-form input {
    width: 100%;             /* Fills the 400px container */
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: var(--border-radius);
    background: var(--background);
}

.login-form button {
    background: linear-gradient(135deg, var(--primary) 0%, hsl(310, 100%, 70%) 100%);
    color: var(--primary-foreground);
    padding: 0.8rem;
    border: none;
    border-radius: var(--border-radius);
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s;
}

.login-form button:hover {
    transform: translateY(-2px);
}
        .message {
            text-align: center;
            margin-top: 1rem;
            color: var(--destructive);
        }
        .signup-link {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .signup-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <span class="logo-icon"><img src="Gambars/logo2.jpg" alt="Logo" /></span>
                    <h1>Nors Bakery</h1>
                </a>
            </div>
        </div>
    </header>

<header class="header">
    </header>

<div class="login-container">
    <h2>Login</h2>

    <form class="login-form" onsubmit="window.login(event)">
        <input type="email" id="login-email" placeholder="Email Address" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary btn-full">Login</button>
    </form>

    <p id="message" class="message"></p>
    
    <div class="signup-link">
        Don't have an account? <a href="register.html">Sign up here</a>
    </div>
    <div class="signup-link">
        Admin? <a href="admin.html">Login as Admin</a>
    </div>
</div>

    <script type="module" src="script.js"></script>
</body>
</html>
