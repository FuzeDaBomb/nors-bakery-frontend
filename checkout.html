<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Nors Bakery</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <span class="logo-icon"><img src="Gambars/logo2.jpg" alt="Logo" /></span>
                    <h1>Nors Bakery</h1>
                </a>
                <nav class="nav-desktop">
                    <a href="index.html" data-testid="nav-home">Home</a>
                    <a href="products.html" data-testid="nav-products">Products</a>
                    <a href="about.html" data-testid="nav-about">About</a>
                    <a href="contact.html" data-testid="nav-contact">Contact</a>
                    <a href="orders.html">My Orders</a>
                </nav>
                <div class="header-actions">
                    <button class="cart-btn" onclick="toggleCart()">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-count" id="cart-count-header">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="checkout-container container">
        <div class="section-header" style="text-align: left; margin-bottom: 2rem;">
            <a href="products.html" style="text-decoration: none; color: var(--muted-foreground);">← Back to Menu</a>
            <h1 class="section-title" style="margin-top: 0.5rem;">Checkout</h1>
        </div>

        <div class="checkout-grid">
            <div class="checkout-left">
                <form id="checkout-form" onsubmit="handleCheckoutSubmit(event)">
                    <!-- Step 1: Delivery -->
                    <div class="checkout-form-section">
                        <div class="section-header-checkout">
                            <div class="step-circle">1</div>
                            <h3>Delivery Method</h3>
                        </div>
                        <div class="radio-options">
                            <label class="radio-option selected" onclick="selectDelivery('pickup')">
                                <input type="radio" name="delivery" value="pickup" checked hidden>
                                <span style="font-size: 1.5rem;">🏪</span>
                                <div>
                                    <strong>Store Pickup</strong>
                                    <div style="font-size: 0.85rem; color: var(--muted-foreground);">Free • Ready in 24 hours</div>
                                </div>
                            </label>
                            <label class="radio-option" onclick="selectDelivery('delivery')">
                                <input type="radio" name="delivery" value="delivery" hidden>
                                <span style="font-size: 1.5rem;">🚚</span>
                                <div>
                                    <strong>Delivery</strong>
                                    <div style="font-size: 0.85rem; color: var(--muted-foreground);">RM 15.00 • Within 15km radius</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Step 2: Details -->
                    <div class="checkout-form-section">
                        <div class="section-header-checkout">
                            <div class="step-circle">2</div>
                            <h3>Your Details</h3>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" required>
                            </div>
                            <div class="form-group">
                                <label>Phone</label>
                                <input type="tel" required>
                            </div>
                        </div>
                        
                        <div id="delivery-address-fields" style="display: none;">
                            <div class="form-group">
                                <label>Street Address</label>
                                <input type="text" id="addr-input">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>City</label>
                                    <input type="text">
                                </div>
                                <div class="form-group">
                                    <label>Postcode</label>
                                    <input type="text">
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Date</label>
                                <input type="date" id="pickup-date" required>
                            </div>
                            <div class="form-group">
                                <label>Time</label>
                                <input type="time" required>
                            </div>
                        </div>
                    </div>

                    <!-- Step 3: Payment -->
                    <div class="checkout-form-section">
                        <div class="section-header-checkout">
                            <div class="step-circle">3</div>
                            <h3>Payment</h3>
                        </div>
                        <div class="radio-options">
                            <label class="radio-option selected" onclick="selectPayment('card')">
                                <input type="radio" name="payment" value="card" checked hidden>
                                <span>💳 Credit / Debit Card</span>
                            </label>
    
                            <div id="card-payment-details">
                                <div class="form-group">
                                    <label>Card Number</label>
                                    <input type="text" placeholder="0000 0000 0000 0000">
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Expiry</label>
                                        <input type="text" placeholder="MM/YY">
                                    </div>
                                    <div class="form-group">
                                        <label>CVC</label>
                                        <input type="text" placeholder="123">
                                    </div>
                                </div>
                            </div>
                            <label class="radio-option" onclick="selectPayment('alipay')">
                                <input type="radio" name="payment" value="alipay" hidden>
                                <span>📱 Alipay / TNG eWallet</span>
                            </label>
                            <label class="radio-option" onclick="selectPayment('alipay')">
                                <input type="radio" name="payment" value="alipay" hidden>
                            <span>🪙QR pay/ Online Bank</span>
                            </label>
                            <label class="radio-option" onclick="selectPayment('cash')">
                                <input type="radio" name="payment" value="cash" hidden>
                                <span>💵 Cash on Pickup / Delivery</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" style="padding: 1rem; font-size: 1.1rem;">Place Order</button>
                </form>
            </div>

            <!-- Order Summary -->
            <div class="checkout-right">
                <div class="summary-card">
                    <h3>Order Summary</h3>
                    <div id="checkout-items">
                        <p style="color: var(--muted-foreground); padding: 1rem 0;">Loading cart...</p>
                    </div>
                    
                    <div style="margin-top: 1.5rem;">
                        <div class="total-row">
                            <span>Subtotal</span>
                            <span id="checkout-subtotal">RM 0.00</span>
                        </div>
                        <div class="total-row">
                            <span>Tax (6%)</span>
                            <span id="checkout-tax">RM 0.00</span>
                        </div>
                        <div class="total-row">
                            <span>Shipping</span>
                            <span id="checkout-shipping">Free</span>
                        </div>
                        <div class="grand-total">
                            <span>Total</span>
                            <span id="checkout-total">RM 0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3 class="cart-title">Shopping Cart</h3>
            <button class="cart-close" onclick="closeCart()">✕</button>
        </div>
        <div class="cart-content" id="cart-content">
            <div class="cart-items" id="cart-items"></div>
        </div>
        <div class="cart-footer" id="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span class="cart-total-amount" id="cart-total">RM0.00</span>
            </div>
        </div>
    </div>

    <script src="checkout.js"></script>
</body>
</html>
